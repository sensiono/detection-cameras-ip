cameras:
  - id: cam-entrance
    url: 0
    task: attendance
  - id: cam-gate
    url: C:\Users\sofie\OneDrive\Desktop\cut_the_video_keep_each_car_wi.mp4
    task: anpr

faces:
  model: buffalo_l
  det_size: 640
  min_det_score: 0.60      # reject blurry / profile faces before matching
  match_threshold: 0.42
  index_path: models/faces.npz
  liveness:
    enabled: true            # false = une photo imprimée suffit pour pointer
    model: models/antispoof.onnx
    scale: 2.7               # recadrage large : l'indice est au bord, pas sur le visage
    threshold: 0.60


plates:
  weights: models/plate_yolo.pt
  conf: 0.35
  # Modèle entraîné sur plaques tunisiennes (voir training/README.md).
  ocr_model: models/tn_ocr.onnx
  ocr_config: training/tn_plate_config.yaml

confirm:
  votes: 3                 # same identity on N frames before emitting
  window_s: 5.0            # ...within this sliding window
  cooldown_s: 300.0        # then stay quiet for this long

sink:
  url: http://localhost:8000/api/events/
  token: 34782ab9b3e172ca2b9ddae66e3dfed658a68c87
  timeout_s: 5.0


runtime:
  gpu: true
  frame_stride: 3          # process 1 frame out of N
  snapshots: true          # attach the detection crop to each event
