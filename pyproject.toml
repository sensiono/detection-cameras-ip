[project]
name = "vision"
version = "0.1.0"
description = "AI service: face-recognition attendance + ANPR from IP cameras"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",          # swap for onnxruntime-gpu on a CUDA machine
    "ultralytics>=8.2",
    "fast-plate-ocr>=1.0",   # LicensePlateRecognizer API
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
vision = "vision.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vision*"]

[tool.ruff]
line-length = 100

